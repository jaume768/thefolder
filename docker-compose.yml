version: '3'
services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  contenedor-backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:MTbkLdKmcrYZiDPkGirSXlKlZvAcCofQ@viaduct.proxy.rlwy.net:20897

  contenedor-frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80" 
    depends_on:
      - contenedor-backend

  contenedor-admin:
    build: ./frontend-admin
    container_name: admin
    ports:
      - "3001:80"
    depends_on:
      - contenedor-backend

volumes:
  mongo-data:
